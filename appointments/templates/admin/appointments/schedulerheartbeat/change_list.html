{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {% if request.user.is_superuser or request.user.role == "admin" %}
    <li style="display: inline-block; margin-right: 6px;">
      <form method="post" action="{% url 'admin:appointments_schedulerheartbeat_run_sync' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary btn-sm">Run sync now</button>
      </form>
    </li>
    <li style="display: inline-block; margin-right: 6px;">
      <form method="post" action="{% url 'admin:appointments_schedulerheartbeat_run_report' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary btn-sm">Run report now</button>
      </form>
    </li>
    <li style="display: inline-block; margin-right: 6px;">
      <a class="btn btn-info btn-sm" href="{% url 'admin:appointments_schedulerheartbeat_reports' %}?date=today">
        View report
      </a>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
