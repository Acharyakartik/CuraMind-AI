{% extends "base.html" %}
{% block title %}Login | CuraMind AI{% endblock %}
{% block content %}
  <div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2 style="margin:0 0 8px 0">Sign in</h2>
    <div class="muted" style="margin-bottom:12px">Use your CuraMind AI credentials.</div>
    <form method="post">
      {% csrf_token %}
      <div style="display:grid; gap:10px">
        {{ form.as_p }}
        <button class="btn" type="submit">Login</button>
      </div>
    </form>
  </div>
{% endblock %}
