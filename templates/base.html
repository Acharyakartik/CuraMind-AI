<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CuraMind AI{% endblock %}</title>
    <style>
      :root { --bg:#0b1220; --card:#111a2e; --text:#e7ecff; --muted:#aab3d6; --accent:#46d3a2; --danger:#ff5a7a; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: radial-gradient(1200px 800px at 30% 10%, #152147 0%, var(--bg) 55%); color:var(--text); }
      a { color: var(--accent); text-decoration: none; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom: 18px; }
      .brand { font-weight: 800; letter-spacing: 0.3px; }
      .card { background: rgba(17, 26, 46, 0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; box-shadow: 0 12px 44px rgba(0,0,0,0.35); }
      .grid { display:grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
      .col-6 { grid-column: span 6; }
      .col-12 { grid-column: span 12; }
      .muted { color: var(--muted); }
      .tag { display:inline-block; padding: 4px 10px; border-radius: 999px; border:1px solid rgba(255,255,255,0.12); color: var(--muted); font-size: 12px; }
      .btn { display:inline-block; padding: 10px 12px; border-radius: 12px; background: rgba(70,211,162,0.15); border:1px solid rgba(70,211,162,0.35); color: var(--text); }
      .btn.danger { background: rgba(255,90,122,0.12); border-color: rgba(255,90,122,0.35); }
      table { width:100%; border-collapse: collapse; }
      th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.10); }
      th { color: var(--muted); font-weight: 600; font-size: 13px; }
      @media (max-width: 860px) { .col-6 { grid-column: span 12; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">CuraMind AI <span class="tag">Diagnostics</span></div>
        <div>
          {% if user.is_authenticated %}
            <span class="muted">Signed in as {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
              {% csrf_token %}
              <button class="btn danger" type="submit">Logout</button>
            </form>
          {% else %}
            <a class="btn" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
      {% if messages %}
        <div class="card" style="margin-bottom:12px">
          {% for message in messages %}
            <div class="muted">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
